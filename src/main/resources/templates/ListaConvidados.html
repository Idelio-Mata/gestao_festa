<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Lista de Convidados</title>

    <!-- Bootstrap 5 via Webjars -->
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>


</head>


<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Lista de Convidados</h2>
        </div>

        <div class="card-body">
            <table class="table table-bordered table-hover table-striped">
                <thead >
                <tr>
                    <th>Nome</th>
                    <th>Acompanhantes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="convidado : ${convidados}">
                    <td th:text="${convidado.nome}"></td>
                    <td th:text="${convidado.quantidadeAcompanhantes}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="btn-group">
        <button type="button" class="btn btn-success">This is a success button</button>
        <button type="button" class="btn btn-warning">This is a warning button</button>
        <button type="button" class="btn btn-danger">This is a danger button</button>
    </div>
</div>

</body>
</html>
